name: Publiceer naar GitHub Pages

on:
  push:
    branches: [main]
  # De 2e van elke maand: dan staat de slotkoers van de vorige maand vast.
  # Deze werkstroom haalt de koersen server-side op (geen CORS) en publiceert
  # ze mee, zodat de app ze als gewoon bestand van zijn eigen origin leest.
  schedule:
    - cron: '17 6 2 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Testsuite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    name: Koersen en deploy
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Koersen ophalen bij Yahoo
        run: node scripts/koersen-ophalen.mjs "${{ vars.TICKER || 'SUSW.L' }}"
      # De publicatie gebruikt het bestand uit de werkmap, niet uit de commit:
      # ophalen en publiceren gebeuren in dezelfde job, zodat een mislukte
      # push de nieuwe koersen nooit tegenhoudt. Het vastleggen hieronder is
      # puur historiek — en dus uitdrukkelijk niet fataal.
      - name: Koersen vastleggen in de repo
        continue-on-error: true
        run: |
          if git diff --quiet -- data/koersen.json; then
            echo 'Geen nieuwe koersen.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Maandkoersen bijgewerkt' -- data/koersen.json
            git push
          fi
      - name: Pages configureren
        uses: actions/configure-pages@v5
      - name: Site als artefact uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Naar Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
